name: Build iOS (.ipa) & Android (.apk)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Analyze & Test
        run: |
          flutter analyze
          flutter test

      - name: Build Android Release APK
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFStudioPro-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios-ipa:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Configure iOS Podfile if present
        run: |
          if [ -f ios/Podfile ]; then
            cd ios
            sed -i '' "s/# platform :ios, '.*'/platform :ios, '15.0'/g" Podfile
            pod install --repo-update
            cd ..
          fi

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r PDFStudioPro-iOS-unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFStudioPro-iOS-IPA
          path: PDFStudioPro-iOS-unsigned.ipa
